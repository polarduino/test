<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Wizytówek QR z Logo</title>
    <!-- Biblioteka qr-code-styling z obsługą logo -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<style>
        body {
            font-family: Arial, sans-serif;
            max-width: 550px;
            margin: 20px auto;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #download-btn {
            background-color: #28a745;
            display: none;
        }
        #download-btn:hover {
            background-color: #218838;
        }

        /* Kontener główny sekcji wyniku */
        #qrcode-container {
            margin-top: 25px;
            width: 100%;
            text-align: center;
        }

        /* Kontener samego kodu QR */
        #qrcode {
            display: block;
            width: 100%;
            text-align: center;
            margin: 15px auto;
        }

        /* KLUCZOWA POPRAWKA DLA FIREFOX MOBILE:
           Wymuszenie centrowania elementu SVG/Canvas generowanego przez bibliotekę */
        #qrcode svg, 
        #qrcode canvas {
            display: block !important;
            margin: 0 auto !important;
            float: none !important;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h2>Generator Wizytówki QR z Logo</h2>
    
    <div class="form-group">
        <label for="firstName">Imię:</label>
        <input type="text" id="firstName" placeholder="Jan">
    </div>
    
    <div class="form-group">
        <label for="lastName">Nazwisko:</label>
        <input type="text" id="lastName" placeholder="Kowalski">
    </div>

    <div class="form-group">
        <label for="org">Firma / Organizacja:</label>
        <input type="text" id="org" placeholder="Moja Firma Sp. z o.o.">
    </div>
    
    <div class="form-group">
        <label for="phone">Telefon:</label>
        <input type="tel" id="phone" placeholder="+48123456789">
    </div>
    
    <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="jan.kowalski@example.com">
    </div>

    <div class="form-group">
        <label for="url">Strona WWW:</label>
        <input type="url" id="url" placeholder="https://example.com">
    </div>

    <div class="form-group">
        <label for="logoInput">Logo firmowe (PNG / JPG):</label>
        <input type="file" id="logoInput" accept="image/*">
    </div>

    <button onclick="generateQR()">Generuj Kod QR z Logo</button>

    <div id="qrcode-container">
        <div id="qrcode"></div>
        <button id="download-btn" onclick="downloadQR()">Pobierz Kod QR (PNG)</button>
    </div>

<script>
    let qrCode = null;

    // Escapowanie wartości tekstowych vCard (N, FN, ORG)
    function esc(s) {
        return s.replace(/\\/g, '\\\\')
                .replace(/\r?\n/g, '\\n')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,');
    }
    // Pola bez znaczenia strukturalnego: tylko usunięcie łamania linii
    function flat(s) {
        return s.replace(/[\r\n]+/g, ' ');
    }

    function generateQR() {
        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const org   = document.getElementById('org').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const url   = document.getElementById('url').value.trim();
        const logoFile = document.getElementById('logoInput').files[0];

        if (!firstName && !lastName) {
            alert('Wprowadź przynajmniej imię lub nazwisko!');
            return;
        }

        const fullName = [firstName, lastName].filter(Boolean).join(' ');

        const lines = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            `N:${esc(lastName)};${esc(firstName)};;;`,
            `FN:${esc(fullName)}`
        ];
        if (org)   lines.push(`ORG:${esc(org)}`);
        if (phone) lines.push(`TEL;TYPE=CELL:${flat(phone)}`);
        if (email) lines.push(`EMAIL;TYPE=INTERNET:${flat(email)}`);
        if (url)   lines.push(`URL:${flat(url)}`);
        lines.push('END:VCARD');

        const vCardData = lines.join('\r\n');

        if (logoFile) {
            const reader = new FileReader();
            reader.onload = e => renderQRCode(vCardData, e.target.result);
            reader.readAsDataURL(logoFile);
        } else {
            renderQRCode(vCardData, undefined);
        }
    }

    function renderQRCode(data, logoUrl) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = '';

        qrCode = new QRCodeStyling({
            width: 800,
            height: 800,
            type: "svg",
            data: data,
            image: logoUrl,
            dotsOptions: { color: "#000000", type: "rounded" },
            backgroundOptions: { color: "#ffffff" },
            imageOptions: {
                crossOrigin: "anonymous",
                margin: 5,
                imageSize: 0.25
            },
            qrOptions: { errorCorrectionLevel: "H" }
        });

        qrCode.append(qrContainer);
        document.getElementById('download-btn').style.display = 'block';
    }

    function downloadQR() {
        if (qrCode) {
            qrCode.download({ name: "wizytowka_qr", extension: "png" });
        }
    }
</script>
</body>
</html>
